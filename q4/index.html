<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Responsive section layout — BCM assessment</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header><h1>Responsive section layout</h1></header>
  <main class="layout" aria-label="Assessment sections">
    <section class="panel panel-a" aria-labelledby="heading-a"><h2 id="heading-a">A</h2></section>
    <section class="panel panel-d" aria-labelledby="heading-d"><h2 id="heading-d">D</h2></section>
    <section class="panel panel-b" aria-labelledby="heading-b"><h2 id="heading-b">B</h2></section>
    <section class="panel panel-c" aria-labelledby="heading-c"><h2 id="heading-c">C</h2></section>
    <section class="panel panel-e" aria-labelledby="heading-e"><h2 id="heading-e">E</h2></section>
    <section class="panel panel-f" aria-labelledby="heading-f"><h2 id="heading-f">F</h2></section>
    <section class="panel panel-g" aria-labelledby="heading-g"><h2 id="heading-g">G</h2></section>
    <section class="panel panel-h" aria-labelledby="heading-h"><h2 id="heading-h">H</h2></section>
  </main>
</body>
</html>
